name: Bot de vagas

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar o bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CV=$(ls | grep -i '\.pdf$' | head -1)
          python job_bot.py --cv "$CV" --telegram --dias 7

      - name: Salvar historico de vagas
        run: |
          git config user.name "bot-vagas"
          git config user.email "bot-vagas@users.noreply.github.com"
          git add vagas.db
          git diff --cached --quiet || (git commit -m "atualiza historico" && git push)
